name: Tests and installed package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests -q
      - run: python -m pip wheel --no-deps . --wheel-dir /tmp/sourceglint-dist
      - run: |
          python -m venv /tmp/sourceglint-installed
          /tmp/sourceglint-installed/bin/python -m pip install /tmp/sourceglint-dist/*.whl
          cd /tmp
          /tmp/sourceglint-installed/bin/python "$GITHUB_WORKSPACE/scripts/check_installed_runtime.py"

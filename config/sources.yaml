# gtm-intelligence runtime source registry — connector source of truth.
# Schema: schemas/source_registry.schema.json
#
# SECURITY: `credentials` lists only the NAMES of required credentials.
# Real secrets live in host credential storage — never commit them here.
#
# Runtime adapter registry. Broad discovery coverage lives separately in
# source_catalog.yaml so catalog breadth cannot be mistaken for connector code.
#   host_web_search  — reuse host web search capability (T4 background)
#   official_web     — first-party pages (T1): product/pricing/changelog/blog
#   reddit           — community voice (T2), official OAuth path
#   hacker_news      — community voice (T2), Algolia API free
#   github           — first-party signals (T1): repo search/activity

- name: host_web_search
  enabled: true
  type: web
  cost: free
  auth_required: false
  credentials: []
  priority: 60
  capabilities: [search]
  rate_limit: { rpm: 30 }
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en, ja, zh, de, fr, ko]
  cache_ttl: 900

- name: official_web
  enabled: true
  type: official
  cost: free
  auth_required: false
  credentials: []
  priority: 90
  capabilities: [fetch]
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en, ja, zh, de, fr, ko]
  cache_ttl: 3600

- name: reddit
  enabled: true
  type: community
  cost: free
  # Default runtime discovery uses Reddit's public Atom/RSS search feed.
  # OAuth credentials may still be supplied for the richer official route,
  # but RSS intentionally does not claim engagement or full comment depth.
  auth_required: false
  credentials: []
  priority: 80
  capabilities: [search]
  rate_limit: { rpm: 60 }
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en, ja, zh, de, fr, ko]
  cache_ttl: 900
  # The public RSS endpoint rate-limits repeated variants aggressively. One
  # well-shaped topic query is reliable; host search covers additional lanes.
  max_queries_per_run: 1

- name: hacker_news
  enabled: true
  type: community
  cost: free
  auth_required: false
  credentials: []
  priority: 70
  capabilities: [search, stories, comments]
  rate_limit: { rpm: 60 }
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en]
  cache_ttl: 1800

- name: github
  enabled: true
  type: official
  cost: free
  auth_required: false
  credentials: []
  priority: 85
  # Capability honesty (Phase 4 §44): the MVP adapter implements repo
  # SEARCH only. `releases` was listed here before the adapter existed;
  # a future adapter may re-add it, config must never out-claim code.
  capabilities: [search]
  rate_limit: { rpm: 60 }
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en, ja, zh, de, fr, ko]
  cache_ttl: 3600

- name: bluesky
  # Uses a Bluesky app password, never the main account password. Public-web
  # fallback stays available because network-level blocking can still occur.
  enabled: true
  type: community
  cost: free
  auth_required: true
  credentials: [BSKY_HANDLE, BSKY_APP_PASSWORD]
  priority: 75
  capabilities: [search]
  rate_limit: { rpm: 30 }
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en, ja, zh, de, fr, ko]
  cache_ttl: 900

- name: youtube
  # Keyless metadata search through a locally installed yt-dlp executable.
  # No browser cookies are read and no video/audio is downloaded.
  enabled: true
  type: community
  cost: free
  auth_required: false
  credentials: []
  priority: 78
  capabilities: [search]
  rate_limit: { rpm: 10 }
  markets: [global]
  languages: [en]
  cache_ttl: 3600


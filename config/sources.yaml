# gtm-intelligence runtime source registry — connector source of truth.
# Schema: schemas/source_registry.schema.json
#
# SECURITY: `credentials` lists only the NAMES of required credentials.
# Real secrets live in host credential storage — never commit them here.
#
# Runtime adapter registry. Broad discovery coverage lives separately in
# source_catalog.yaml so catalog breadth cannot be mistaken for connector code.
#   host_web_search  — reuse host web search capability (T4 background)
#   official_web     — first-party pages (T1): product/pricing/changelog/blog
#   reddit           — community voice (T2), official OAuth path
#   hacker_news      — community voice (T2), Algolia API free
#   github           — first-party signals (T1): repo search/activity

- name: host_web_search
  enabled: true
  type: web
  cost: free
  auth_required: false
  credentials: []
  priority: 60
  capabilities: [search]
  rate_limit: { rpm: 30 }
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en, ja, zh, de, fr, ko]
  cache_ttl: 900

- name: official_web
  enabled: true
  type: official
  cost: free
  auth_required: false
  credentials: []
  priority: 90
  capabilities: [fetch]
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en, ja, zh, de, fr, ko]
  cache_ttl: 3600

- name: reddit
  enabled: true
  type: community
  cost: free
  # Phase 4 §9: Reddit's official OAuth2 client_credentials flow
  # requires REDDIT_CLIENT_ID + REDDIT_CLIENT_SECRET. The adapter is
  # contract-complete and raises AdapterAuthMissing BEFORE any HTTP
  # call when either credential is absent — letting the orchestrator
  # record AUTH_MISSING and gracefully degrade.
  auth_required: true
  credentials:
    - REDDIT_CLIENT_ID
    - REDDIT_CLIENT_SECRET
  priority: 80
  capabilities: [search, comments]
  rate_limit: { rpm: 60 }
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en, ja, zh, de, fr, ko]
  cache_ttl: 900

- name: hacker_news
  enabled: true
  type: community
  cost: free
  auth_required: false
  credentials: []
  priority: 70
  capabilities: [search, stories, comments]
  rate_limit: { rpm: 60 }
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en]
  cache_ttl: 1800

- name: github
  enabled: true
  type: official
  cost: free
  auth_required: false
  credentials: []
  priority: 85
  # Capability honesty (Phase 4 §44): the MVP adapter implements repo
  # SEARCH only. `releases` was listed here before the adapter existed;
  # a future adapter may re-add it, config must never out-claim code.
  capabilities: [search]
  rate_limit: { rpm: 60 }
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en, ja, zh, de, fr, ko]
  cache_ttl: 3600

- name: bluesky
  # Adapter is implemented and covered offline, but the 2026-09-29 live
  # check from the current host returned HTTP 403. Keep public-web fallback
  # active through source_catalog.yaml; do not claim this direct path yet.
  enabled: false
  type: community
  cost: free
  auth_required: false
  credentials: []
  priority: 75
  capabilities: [search]
  rate_limit: { rpm: 30 }
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en, ja, zh, de, fr, ko]
  cache_ttl: 900

# --- Phase 2+ sources (declared, disabled — registry contract only, no code) ---

- name: youtube
  enabled: false
  type: community
  cost: free
  auth_required: true
  credentials: [YOUTUBE_API_KEY]
  priority: 50
  capabilities: [search, comments]
  rate_limit: { rpm: 10 }
  markets: [global]
  languages: [en]
  cache_ttl: 3600

- name: product_hunt
  enabled: false
  type: marketplace
  cost: free
  auth_required: true
  credentials: [PRODUCT_HUNT_TOKEN]
  priority: 40
  capabilities: [search, comments]
  markets: [global]
  languages: [en]
  cache_ttl: 3600

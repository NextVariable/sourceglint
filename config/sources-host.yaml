# First-run profile: host search, without platform credentials.
- name: host_web_search
  enabled: true
  type: web
  cost: free
  auth_required: false
  credentials: []
  priority: 60
  capabilities: [search]
  markets: [global, us, gb, jp, de, fr, kr, cn]
  languages: [en, ja, zh, de, fr, ko]
  cache_ttl: 900
  max_queries_per_run: 3

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sourceglint"
version = "0.2.2.dev3"
description = "Evidence-linked recent information and demand discovery with optional GTM decision support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "francis" }]

dependencies = [
    "jsonschema>=4.20",
    "referencing>=0.35",
    "rfc3339-validator>=0.1.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
sourceglint = "sourceglint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sourceglint = ["intelligence/prompts/*.md", "insights/prompts/*.md", "recommendations/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

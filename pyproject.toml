[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sourceglint"
version = "0.2.2.dev4"
description = "Cross-platform research of the last 30 days: new tools, market developments and user feedback for product managers, GTM teams and tech explorers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sourceglint Contributors" }]

dependencies = [
    "jsonschema>=4.20",
    "referencing>=0.35",
    "rfc3339-validator>=0.1.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff==0.12.0",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
sourceglint = "sourceglint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sourceglint = ["intelligence/prompts/*.md", "insights/prompts/*.md", "recommendations/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
